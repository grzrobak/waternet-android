apply plugin: 'com.android.application'

// Bump these when you change the game; the data files are re-unpacked on
// the phone whenever their checksum changes.
def gameVersionCode = 1
def gameVersionName = "1.0"

android {
    namespace "org.waternetport.android"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.waternetport.android"
        minSdk 21
        targetSdk 34
        versionCode gameVersionCode
        versionName gameVersionName
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-21"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }

    // One fixed key for every build, so a newer APK installs over an older
    // one and your progress is kept. It only signs your own sideloaded copy.
    signingConfigs {
        shared {
            storeFile file('waternet.keystore')
            storePassword 'waternet'
            keyAlias 'waternet'
            keyPassword 'waternet'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main {
        // SDL's Java glue comes straight from the pinned SDL checkout
        java.srcDirs += ['jni/SDL/android-project/app/src/main/java']
        // the original game data plus a generated file list
        assets.srcDirs = ['../../assets', "$buildDir/generated/waternetAssets"]
    }

    lint {
        abortOnError false
    }
}

// The game reads its files with fopen()/opendir(), so on first start (and
// after updates) port.cpp unpacks every file listed in manifest.txt.
tasks.register('generateAssetManifest') {
    def assetsDir = file('../../assets')
    def outDir = file("$buildDir/generated/waternetAssets")
    inputs.dir assetsDir
    outputs.dir outDir
    doLast {
        def files = []
        assetsDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            files << assetsDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
        }
        files.sort()
        def md = java.security.MessageDigest.getInstance('MD5')
        files.each { md.update(new File(assetsDir, it).bytes) }
        def sum = new BigInteger(1, md.digest()).toString(16)
        outDir.mkdirs()
        new File(outDir, 'manifest.txt').text = (["waternet-${gameVersionName}-${sum}"] + files).join('\n') + '\n'
    }
}
preBuild.dependsOn 'generateAssetManifest'

dependencies {
}
