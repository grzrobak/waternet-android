name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download SDL2 libraries
        run: bash android/fetch-libs.sh

      - name: Build APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Waternet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Waternet-apk
          path: Waternet.apk

      - name: Publish as the "latest" release (easy to download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Waternet.apk \
            --target "$GITHUB_SHA" \
            --title "Waternet for Android (latest build)" \
            --notes "Android port of Waternet for the Dingoo by Willems Davy - Willems Soft - http://www.willemssoft.be. Free, not for sale. Download Waternet.apk on your phone and open it to install."

  # Starts the APK on an Android emulator and saves the log and screenshots
  emulator-test:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Waternet-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: test-output

      - name: Save results to the emulator-results branch
        if: always()
        run: |
          cd test-output
          git init -q -b emulator-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Emulator test results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" emulator-results
